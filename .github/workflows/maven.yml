
name: HostelManagementSystem Maven CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test WAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Validate Maven project
        run: mvn --batch-mode validate

      - name: Build and run tests
        run: mvn --batch-mode clean verify

      - name: Verify WAR file
        shell: bash
        run: |
          WAR_FILE="target/HostelManagementSystem.war"

          if [ ! -f "$WAR_FILE" ]; then
            echo "ERROR: WAR file not found: $WAR_FILE"
            echo "Available files in target/:"
            ls -lah target/ || true
            exit 1
          fi

          echo "WAR generated successfully:"
          ls -lh "$WAR_FILE"

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: HostelManagementSystem-war
          path: target/HostelManagementSystem.war
          if-no-files-found: error
          retention-days: 7
