name: HostelManagementSystem - Maven CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test Java 17 WAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Display Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Validate Maven project
        run: mvn --batch-mode validate

      - name: Build and run tests
        run: mvn --batch-mode clean verify

      - name: Verify WAR artifact
        run: |
          test -f target/HostelManagementSystem.war
          ls -lh target/HostelManagementSystem.war

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: HostelManagementSystem-war
          path: target/HostelManagementSystem.war
          if-no-files-found: error
          retention-days: 7
          name: HostelManagementSystem-war
          path: target/HostelManagementSystem.war
          if-no-files-found: error
          retention-days: 7
